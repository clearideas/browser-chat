<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clear Ideas Widget Locale Test</title>
    <script>
      const params = new URLSearchParams(window.location.search)
      const initialLang = params.get('lang')
      if (initialLang) {
        document.documentElement.lang = initialLang
      }
    </script>
    <link rel="stylesheet" id="widget-css" />
    <script>
      document.getElementById('widget-css').href = '/dist/clearideas-widget.css?v=' + Date.now()
    </script>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        margin: 0;
        padding: 24px;
        background: #f6f7f9;
        color: #111827;
      }

      .panel {
        max-width: 840px;
        margin: 0 auto;
        padding: 20px;
        background: #fff;
        border: 1px solid #d1d5db;
        border-radius: 12px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      }

      .controls {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        margin: 16px 0 20px;
      }

      button,
      select {
        font: inherit;
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        background: #fff;
      }

      button {
        cursor: pointer;
      }

      pre {
        padding: 16px;
        background: #0f172a;
        color: #e2e8f0;
        border-radius: 10px;
        overflow: auto;
        font-size: 12px;
      }

      .hint {
        color: #475569;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Widget Locale Test</h1>
      <p class="hint">
        This page initializes the widget without passing <code>locale</code>. It should detect and
        follow <code>&lt;html lang&gt;</code>.
      </p>

      <div class="controls">
        <label for="lang-select">Page language</label>
        <select id="lang-select">
          <option value="en">English</option>
          <option value="fr">Francais</option>
        </select>
        <button id="apply-lang">Apply page language</button>
        <button id="open-widget">Open widget</button>
        <button id="refresh-debug">Refresh debug</button>
      </div>

      <p class="hint">Current document language: <strong id="current-lang">en</strong></p>
      <pre id="debug-output">Waiting for widget...</pre>
    </div>

    <script id="widget-js"></script>
    <script>
      document.getElementById('widget-js').src = '/dist/clearideas-widget.iife.js?v=' + Date.now()

      const langSelect = document.getElementById('lang-select')
      const currentLang = document.getElementById('current-lang')
      const debugOutput = document.getElementById('debug-output')
      let widget = null
      let debugInterval = null

      function updateDebug() {
        currentLang.textContent = document.documentElement.lang || '(empty)'
        debugOutput.textContent = JSON.stringify(
          window.__ClearIdeasWidgetLocaleDebug || { missing: true },
          null,
          2,
        )
      }

      function applyLanguage() {
        const nextLocale = langSelect.value
        document.documentElement.lang = nextLocale
        updateDebug()
      }

      document.getElementById('apply-lang').addEventListener('click', applyLanguage)
      document.getElementById('refresh-debug').addEventListener('click', updateDebug)
      document.getElementById('open-widget').addEventListener('click', () => {
        if (widget) {
          widget.open()
        }
      })

      document.getElementById('widget-js').onload = function () {
        widget = window.ClearIdeasWidget.init({
          accessKey: 'your-public-chat-widget-key',
          apiBaseUrl: 'https://api.example.test',
        })

        updateDebug()

        debugInterval = setInterval(updateDebug, 1000)
      }

      window.addEventListener('beforeunload', () => {
        if (debugInterval !== null) {
          clearInterval(debugInterval)
        }
      })
    </script>
  </body>
</html>
