<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clear Ideas Widget Test</title>
    <link rel="stylesheet" id="widget-css" />
    <script>
      // Cache-busting: force fresh CSS load
      document.getElementById('widget-css').href =
        'https://updates.clearideas.com/chat.css?v=' + Date.now()
    </script>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        padding: 40px;
        max-width: 1200px;
        margin: 0 auto;
        transition:
          background-color 0.3s ease,
          color 0.3s ease;
      }

      body.dark-mode {
        background-color: #1a1a1a;
        color: #ffffff;
      }

      .test-section {
        margin-bottom: 40px;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 8px;
        transition:
          border-color 0.3s ease,
          background-color 0.3s ease;
      }

      body.dark-mode .test-section {
        border-color: #444;
        background-color: #2a2a2a;
      }

      h1 {
        color: #333;
        transition: color 0.3s ease;
      }

      body.dark-mode h1 {
        color: #ffffff;
      }

      h2 {
        color: #666;
        margin-top: 0;
        transition: color 0.3s ease;
      }

      body.dark-mode h2 {
        color: #cccccc;
      }

      code {
        background: #f5f5f5;
        padding: 2px 6px;
        border-radius: 3px;
        font-family: 'Courier New', monospace;
        transition: background-color 0.3s ease;
      }

      body.dark-mode code {
        background: #444;
        color: #ffffff;
      }

      label span {
        transition: color 0.3s ease;
      }

      body.dark-mode label span {
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <h1>Clear Ideas Widget Test Page</h1>

    <div class="test-section">
      <h2>Controls</h2>
      <label style="display: flex; align-items: center; gap: 8px; cursor: pointer">
        <input
          type="checkbox"
          id="dark-mode-toggle"
          style="width: 18px; height: 18px; cursor: pointer"
        />
        <span>Dark Mode</span>
      </label>
    </div>

    <div class="test-section">
      <h2>Auto-initialization</h2>
      <p>The widget will auto-initialize when the page loads:</p>
    </div>

    <div class="test-section">
      <h2>Console Output</h2>
      <p>Check the browser console for any errors or logs.</p>
    </div>

    <script id="widget-js"></script>

    <script>
      // Cache-busting: force fresh JS load
      document.getElementById('widget-js').src =
        'https://updates.clearideas.com/chat.js?v=' + Date.now()

      let widget = null

      // Best practice for plain JavaScript:
      // 1. Set initial values in config
      // 2. Use setter methods to update props dynamically
      // (For Vue.js, you can pass refs/computed for automatic reactivity)
      const widgetConfig = {
        accessKey: 'your-public-chat-widget-key',
        apiBaseUrl: 'https://api.example.test',
        darkMode: false, // Initial value
        // Other props can be set here: width, height, position, etc.
      }

      // Wait for script to load before initializing
      document.getElementById('widget-js').onload = function () {
        widget = window.ClearIdeasWidget.init(widgetConfig)

        // Set up dark mode toggle - use setter method for updates
        // This is the best practice for plain JavaScript (non-Vue) implementations
        const darkModeToggle = document.getElementById('dark-mode-toggle')
        darkModeToggle.addEventListener('change', function (e) {
          const isDark = e.target.checked
          widget.setDarkMode(isDark)
          // Also toggle dark mode class on body for page theming
          document.body.classList.toggle('dark-mode', isDark)
        })

        // Example: Update other props dynamically
        // widget.setWidth(400)
        // widget.setHeight(600)
        // widget.setPosition('top-left')
        // widget.setConsentGranted(true)
      }
    </script>
  </body>
</html>
