name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Check public npm dependency age
        env:
          NPM_RELEASE_AGE_DAYS: '3'
        run: node scripts/check-npm-release-age.mjs
      - run: npm ci
      - run: npm run check
